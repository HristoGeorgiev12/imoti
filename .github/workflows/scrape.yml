name: Update Real Estate Listings

on:
  workflow_dispatch:
  schedule:
    # Runs every 6 hours automatically (UTC)
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers (Shumen & Varna)
        run: |
          python main.py \
            --sources alo.bg imot.bg olx.bg bazar.bg imotisilvi.bg imotitomov.com \
            --regions shumen varna \
            --transactions sale \
            --pages 2

      - name: Commit updated listings.json
        run: |
          git config user.name "imoti-bot"
          git config user.email "imoti-bot@users.noreply.github.com"
          git add data/listings.json
          git diff --staged --quiet || git commit -m "chore: update listings.json"
          git push
